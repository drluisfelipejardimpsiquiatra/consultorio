<style>
/* Acompanhamento do TOC: Y-BOCS autoaplicável (Y-BOCS-SR) a cada 2 semanas, com a lista de sintomas na

:root{

  --f-body:Garet,"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;

}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}

p{margin:0}
.in{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

<script>
// ====== CONFIGURAÇÃO ======
// Mesmo formulário de recebimento do "Meu humor" e do DIVA-5: o cabeçalho [Y-BOCS] identifica o questionário.
const FORM_EXTRA = "https://docs.google.com/forms/d/e/1FAIpQLSdEgVRqms8zbmovVuGCF6k2milxv4Tac83b0YddnNUcPLOgqg/formResponse";
const CAMPO_PACIENTE = "entry.2057517674", CAMPO_RESPOSTAS = "entry.929291522";
const CHAVE = "ybocs.v1";
const DIAS_AVAL = 14;              // intervalo entre avaliações (a escala pergunta pela última semana)
const MOSTRAR_PONTUACAO = true;    // o paciente vê a própria nota e o gráfico

/* Y-BOCS, versão autoaplicável (Goodman et al., 1989; Baer, 1991; Steketee et al., 1996).
   Tradução de trabalho para o português (revisar com a versão brasileira validada antes de uso em pesquisa).
   Itens 1–5: obsessões; 6–10: compulsões. Cada item de 0 a 4; total de 0 a 40. */
const ITENS = [
  { t: "Tempo ocupado pelos pensamentos obsessivos", q: "Quanto do seu tempo é ocupado por pensamentos obsessivos?", o: [
    "Nenhum", "Menos de 1 hora por dia, ou pensamentos de vez em quando", "De 1 a 3 horas por dia, ou pensamentos frequentes",

  { t: "Aflição causada pelos pensamentos obsessivos", q: "Quanta aflição ou angústia os pensamentos obsessivos causam?", o: [

  { t: "Resistência aos pensamentos obsessivos", q: "Quanto esforço você faz para resistir aos pensamentos obsessivos, tentando afastá-los ou desviar a atenção?", o: [

    "Deixo os pensamentos virem sem tentar controlar, mas a contragosto", "Me entrego totalmente aos pensamentos, sem resistir"] },
  { t: "Controle sobre os pensamentos obsessivos", q: "Quanto controle você tem sobre os pensamentos obsessivos? Consegue interrompê-los ou desviar a atenção?", o: [
    "Controle total", "Muito controle: quase sempre consigo interromper ou desviar", "Controle moderado: às vezes consigo",
    "Pouco controle: raramente consigo, e com muita dificuldade", "Nenhum controle: não consigo desviar nem por um instante"] },
  { t: "Tempo gasto com compulsões", q: "Quanto do seu tempo é gasto com compulsões (rituais, verificações, lavagens, contagens, rituais mentais)?", o: [
    "Nenhum", "Menos de 1 hora por dia, ou de vez em quando", "De 1 a 3 horas por dia, ou com frequência",
    "Mais de 3 e até 8 horas por dia, ou com muita frequência", "Mais de 8 horas por dia, ou quase o tempo todo"] },
  { t: "Interferência das compulsões", q: "Quanto as compulsões atrapalham o seu trabalho, os estudos, a vida social ou as tarefas do dia a dia?", o: [
    "Nada", "Pouco: atrapalham um pouco, mas consigo fazer tudo", "Moderadamente: atrapalham com clareza, mas ainda consigo dar conta",
    "Muito: causam prejuízo importante no que preciso fazer", "Extremamente: me impedem de fazer as coisas"] },
  { t: "Aflição se impedido(a) de fazer as compulsões", q: "Como você se sentiria se fosse impedido(a) de fazer as compulsões? Quanta ansiedade sentiria?", o: [
    "Nenhuma ansiedade", "Um pouco de ansiedade", "A ansiedade aumentaria, mas eu conseguiria lidar",
    "A ansiedade aumentaria muito e me incomodaria bastante", "Ansiedade extrema, que me paralisaria"] },
  { t: "Resistência às compulsões", q: "Quanto esforço você faz para resistir às compulsões?", o: [
    "Sempre tento resistir, ou quase não tenho compulsões", "Tento resistir na maior parte das vezes", "Faço algum esforço para resistir",
    "Faço as compulsões sem tentar controlar, mas a contragosto", "Me entrego totalmente às compulsões, sem resistir"] },
  { t: "Controle sobre as compulsões", q: "Quanto controle você tem sobre as compulsões? Quando sente a vontade forte de fazê-las, consegue segurar?", o: [
    "Controle total", "Muito controle: sinto a pressão, mas quase sempre consigo segurar", "Controle moderado: a pressão é forte e só seguro com dificuldade",
    "Pouco controle: a vontade é muito forte e, no máximo, consigo adiar", "Nenhum controle: a vontade é avassaladora e não consigo segurar"] }];
const FAIXAS = [[0, 7, "subclínicos"], [8, 15, "leves"], [16, 23, "moderados"], [24, 31, "graves"], [32, 40, "extremos"]];
const faixa = (t) => FAIXAS.find(([a, b]) => t >= a && t <= b)[2];

/* Lista de sintomas (baseada na lista de sintomas da Y-BOCS), em linguagem simples. Marca só o que acontece atualmente. */
const LISTA = [
  ["O", "Medo de machucar alguém ou a si mesmo(a) sem querer, ou de perder o controle", [
    "Medo de machucar outras pessoas", "Medo de machucar a mim mesmo(a)", "Imagens violentas ou horríveis que invadem a mente",
    "Medo de dizer palavrões, ofensas ou algo inapropriado", "Medo de fazer algo constrangedor", "Medo de agir por um impulso indesejado",
    "Medo de ser responsável por algo terrível (incêndio, assalto, acidente)"]],
  ["O", "Contaminação", ["Nojo ou preocupação com urina, fezes, saliva, suor ou outras secreções", "Preocupação com sujeira ou germes",
    "Medo de produtos químicos, venenos ou radiação", "Medo de pegar uma doença por contaminação", "Medo de contaminar outras pessoas",
    "Incômodo forte com coisas grudentas ou resíduos"]],
  ["O", "Pensamentos sexuais ou religiosos", ["Pensamentos ou imagens sexuais que considero proibidos ou inaceitáveis", "Pensamentos sexuais envolvendo crianças ou familiares",
    "Dúvidas angustiantes sobre a minha orientação sexual", "Medo de ofender a Deus, de blasfemar ou de cometer pecado", "Preocupação excessiva com certo e errado, moral"]],
  ["O", "Ordem, exatidão e outros", ["Necessidade de que as coisas fiquem simétricas, alinhadas ou \"perfeitas\"", "Necessidade de saber ou de lembrar de coisas",
    "Medo de perder coisas ou de jogar fora algo importante", "Palavras, músicas, sons ou imagens que grudam na mente", "Números ou cores de sorte e de azar; medos supersticiosos",
    "Preocupação com doenças ou com alguma parte do corpo ou da aparência"]],
  ["C", "Limpeza e lavagem", ["Lavar as mãos demais ou de um jeito ritualizado", "Banho, escovação ou higiene demorados ou ritualizados",
    "Limpar objetos ou a casa em excesso", "Evitar tocar em coisas ou lugares por medo de contaminação"]],
  ["C", "Verificação", ["Verificar portas, fechaduras, fogão, gás, tomadas ou aparelhos", "Verificar se não machucou ninguém (ou se não vai machucar)",
    "Verificar se não aconteceu nada de terrível", "Verificar se não cometeu erros (rever, reler, conferir)", "Verificar o corpo ou pedir exames por medo de doença"]],
  ["C", "Repetir, contar, ordenar e guardar", ["Reler ou reescrever as coisas", "Repetir ações (entrar e sair de um lugar, levantar e sentar) até \"ficar certo\"",
    "Contar (passos, objetos, vezes)", "Arrumar e ordenar objetos até ficarem \"do jeito certo\"", "Guardar ou acumular coisas sem conseguir jogar fora"]],
  ["C", "Outros rituais", ["Rituais mentais (rezar, repetir frases ou números na mente, \"anular\" um pensamento ruim)", "Perguntar muitas vezes ou pedir que me tranquilizem",
    "Necessidade de confessar ou de contar as coisas", "Tocar, bater de leve ou esfregar objetos", "Fazer listas em excesso",
    "Arrancar cabelos ou pelos", "Cutucar ou espremer a pele"]]];
const CVV = "Se esses pensamentos estiverem fortes agora, não espere a consulta: ligue <b>188</b> (CVV, 24 h, gratuito), <b>192</b> (SAMU) ou procure o pronto-atendimento mais próximo, e avise a clínica.";

// ====== ESTADO ======
let D = { id: null, hist: [] }, R = null;
try { const s = JSON.parse(localStorage.getItem(CHAVE) || "null"); if (s && Array.isArray(s.hist)) D = s; } catch (e) {}
const salvar = () => { try { localStorage.setItem(CHAVE, JSON.stringify(D)); } catch (e) {} };
// Link pessoal enviado pelo consultório (?c=CÓDIGO&n=Nome): o paciente já chega identificado.
const PARAM = new URLSearchParams(location.search), COD = (PARAM.get("c") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
if (COD.length >= 6 && (!D.id || D.id.codigo !== COD)) { D = { id: { codigo: COD, nome: (PARAM.get("n") || "").trim(), cpf: "", nasc: "", tel: "" }, hist: [] }; salvar(); }
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dataBR = (iso) => new Date(iso).toLocaleDateString("pt-BR");
const dias = (iso) => Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
const ultima = () => D.hist.slice(-1)[0];
const devido = () => { const u = ultima(); return !u || dias(u.d) >= DIAS_AVAL; };
const temLista = () => D.hist.some((h) => h.lista);
function cpfValido(c) {
  c = String(c || "").replace(/\D/g, "");
  if (c.length !== 11 || /^(\d)\1{10}$/.test(c)) return false;
  for (const n of [9, 10]) { let s = 0; for (let i = 0; i < n; i++) s += +c[i] * (n + 1 - i); if ((s * 10 % 11) % 10 !== +c[n]) return false; }
  return true;
}
const mascaraCpf = (v) => { const d = v.replace(/\D/g, "").slice(0, 11); return d.replace(/^(\d{3})(\d)/, "$1.$2").replace(/^(\d{3})\.(\d{3})(\d)/, "$1.$2.$3").replace(/\.(\d{3})(\d{1,2})$/, ".$1-$2"); };
const soma = (a, i, j) => a.slice(i, j).reduce((x, y) => x + y, 0);

// ====== TELAS ======
function primeiroUso() {
  $("tela").innerHTML = `<p class="rot">Obsessões e compulsões</p><h1 class="tit">Acompanhando a sua melhora</h1>
    <p class="sub">Aqui você registra, de tempos em tempos, quanto os pensamentos obsessivos e as compulsões estão ocupando a sua vida. O Dr. Luis Felipe acompanha a evolução entre as consultas.</p>
    <div class="cartao"><p class="q-tit">Como funciona</p>
      <p class="q-desc">• A cada <b>2 semanas</b>: um questionário de 10 perguntas (Y-BOCS), uns 5 minutos.<br>• Na primeira vez, antes dele, uma lista de sintomas para marcar o que acontece com você (mais uns 5 minutos).<br>• Seus dados são pedidos só agora e ficam guardados neste celular.</p></div>
    ${[["nome", "Nome completo", "text"], ["cpf", "CPF", "cpf"], ["nasc", "Data de nascimento", "date"], ["tel", "Celular com DDD", "tel"]].map(([k, t, tp]) =>
      `<div class="cartao" id="c${k}"><p class="q-tit">${t}</p><input id="q${k}" type="${tp === "cpf" ? "text" : tp}" ${tp === "cpf" ? 'inputmode="numeric" maxlength="14" placeholder="000.000.000-00" data-cpf="1"' : tp === "tel" ? 'inputmode="tel" autocomplete="tel"' : tp === "text" ? 'autocomplete="name"' : ""}><p class="q-erro">${k === "cpf" ? "Confira o CPF." : "Preencha este campo."}</p></div>`).join("")}
    <button class="btn pri larga" style="margin-top:18px" id="salvarId">Continuar</button>
    <p class="nota" style="margin-top:12px">Suas respostas vão só para o Dr. Luis Felipe e ficam no seu prontuário, sob sigilo médico e conforme a LGPD.</p>`;
  $("salvarId").onclick = () => {
    const v = (k) => $("q" + k).value.trim(); let ok = true;
    ["nome", "cpf", "nasc", "tel"].forEach((k) => { const ruim = !v(k) || (k === "cpf" && !cpfValido(v(k))); $("c" + k).classList.toggle("erro", ruim); if (ruim) ok = false; });
    if (!ok) return;
    D.id = { nome: v("nome"), cpf: v("cpf").replace(/\D/g, ""), nasc: v("nasc"), tel: v("tel") }; salvar(); inicio();
  };
}
/* Linhas sobrepostas no mesmo eixo (0–40 pontos): total, obsessões (0–20) e compulsões (0–20).
   Cores validadas para daltonismo (terracota × azul; total em tinta neutra, mais grossa). ps: [{d|quando, total, obs, comp}] */
function YB_LINHAS(ps, dataCurta) {
  const S = [["Total", "total", "#2B2A22", 2.6], ["Obsessões", "obs", "#C3622D", 2], ["Compulsões", "comp", "#2F55B5", 2]];
  const W = 360, H = 200, L = 30, Rr = 40, T = 12, B = 26, n = ps.length;
  const x = (i) => n === 1 ? L + (W - L - Rr) / 2 : L + i * (W - L - Rr) / (n - 1), y = (v) => T + (40 - v) * (H - T - B) / 40;
  const tons = ["#F6F4EE", "#F1EDE2", "#EBE4D3", "#E4D9C1", "#DCCDAE"], fx = [[0, 7], [8, 15], [16, 23], [24, 31], [32, 40]];
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Evolução da Y-BOCS: total, obsessões e compulsões" style="width:100%;height:auto;display:block;font-family:Arial,Helvetica,sans-serif">`;
  fx.forEach(([a, b], i) => { const t = y(i === 4 ? b : b + 1); s += `<rect x="${L}" y="${t}" width="${W - L - Rr}" height="${y(a) - t}" fill="${tons[i]}"/>`; });
  [0, 8, 16, 24, 32, 40].forEach((v) => { s += `<text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end" font-size="9.5" fill="#5E5A4C">${v}</text>`; });
  const passo = Math.max(1, Math.ceil(n / 6));
  ps.forEach((p, i) => { if (i % passo === 0 || i === n - 1) s += `<text x="${x(i)}" y="${H - 8}" text-anchor="${n === 1 ? "middle" : i === 0 ? "start" : i === n - 1 ? "end" : "middle"}" font-size="9.5" fill="#5E5A4C">${dataCurta(p)}</text>`; });
  S.forEach(([, k, cor, w]) => {
    if (n > 1) s += `<polyline fill="none" stroke="${cor}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" points="${ps.map((p, i) => `${x(i).toFixed(1)},${y(p[k]).toFixed(1)}`).join(" ")}"/>`;
    ps.forEach((p, i) => { s += `<circle cx="${x(i).toFixed(1)}" cy="${y(p[k]).toFixed(1)}" r="${k === "total" ? 4.5 : 4}" fill="${cor}" stroke="#fff" stroke-width="2"><title>${dataCurta(p)} · ${k === "total" ? "Total" : k === "obs" ? "Obsessões" : "Compulsões"}: ${p[k]}</title></circle>`; });
  });
  // valores do último ponto, à direita, sem sobrepor (texto na cor de texto; a cor da série fica no traço ao lado)
  const u = ps[n - 1], lab = S.map(([nome, k, cor]) => ({ k, cor, v: u[k], y: y(u[k]) })).sort((a, b) => a.y - b.y);
  for (let i = 1; i < lab.length; i++) if (lab[i].y - lab[i - 1].y < 12) lab[i].y = lab[i - 1].y + 12;
  lab.forEach((l) => { const x0 = x(n - 1) + 8; s += `<line x1="${x0}" x2="${x0 + 7}" y1="${l.y}" y2="${l.y}" stroke="${l.cor}" stroke-width="2.5"/><text x="${x0 + 10}" y="${l.y + 3.5}" font-size="10.5" font-weight="700" fill="#2B2A22">${l.v}</text>`; });
  return s + `</svg>`;
}
const YB_LEGENDA = (tam) => `<div style="display:flex;flex-wrap:wrap;gap:4px 14px;font-size:${tam};color:#2B2A22;margin-top:4px">` +
  [["Total (0–40)", "#2B2A22", 3], ["Obsessões (0–20)", "#C3622D", 2.5], ["Compulsões (0–20)", "#2F55B5", 2.5]].map(([t, c, w]) =>
    `<span style="white-space:nowrap"><span style="display:inline-block;width:16px;height:0;border-top:${w}px solid ${c};vertical-align:middle;margin-right:5px"></span>${t}</span>`).join("") + `</div>`;
function graficoSvg() {
  const ps = D.hist.filter((h) => h.obs != null && h.comp != null);
  if (!ps.length) return `<p class="vazio">O gráfico aparece depois da primeira avaliação.</p>`;
  return YB_LINHAS(ps, (p) => dataBR(p.d).slice(0, 5)) + YB_LEGENDA("12.5px") +
    `<p class="nota" style="margin-top:6px">Quanto mais baixas as linhas, menos sintomas. As faixas de fundo, do claro ao escuro, mostram a intensidade do total.</p>`;
}
function inicio() {
  if (!D.id) return primeiroUso();
  const u = ultima(), dev = devido(), falta = u ? Math.max(0, DIAS_AVAL - dias(u.d)) : 0;
  $("tela").innerHTML = `<p class="rot">Olá${D.id.nome ? ", " + esc(D.id.nome.split(" ")[0]) : ""}</p><h1 class="tit">Obsessões e compulsões</h1>
    <div class="proximo">${dev
      ? `<h2>Hora da avaliação</h2><p>${u ? `Já se passaram ${dias(u.d)} dias desde a última.` : "É a primeira: ela serve de ponto de partida para medir a melhora."} ${temLista() ? "São 10 perguntas sobre a última semana, uns 5 minutos." : "Primeiro uma lista de sintomas para marcar, depois 10 perguntas sobre a última semana. Uns 10 minutos."}</p><button class="btn pri larga" id="ir">Responder agora</button>`
      : `<h2>Próxima avaliação ${falta === 0 ? "hoje" : `daqui a ${falta} dia${falta > 1 ? "s" : ""}`}</h2><p>Avaliar a cada 2 semanas mostra a evolução com clareza. Se algo mudou muito, pode responder antes.</p><button class="btn sec larga" style="color:#fff;border-color:rgba(255,255,255,.5)" id="ir">Responder agora mesmo assim</button>`}</div>
    ${MOSTRAR_PONTUACAO ? `<div class="cartao"><p class="q-tit">Sua evolução</p><div class="grafico">${graficoSvg()}</div></div>` : ""}
    ${D.hist.length ? `<div class="cartao"><p class="q-tit">Avaliações</p><ul class="hist">${D.hist.slice(-8).reverse().map((h) => `<li><span>${dataBR(h.d)}</span><span>${MOSTRAR_PONTUACAO ? `${h.total} pontos · ${faixa(h.total)}` : "enviada"}</span></li>`).join("")}</ul></div>` : ""}
    <p class="crise">Em crise, não espere a consulta: <b>188</b> (CVV, 24 h) ou <b>192</b> (SAMU).</p>
    ${D.id.codigo ? "" : `<button class="lnk" id="trocar">Não é ${esc(D.id.nome.split(" ")[0])}? Trocar a pessoa neste celular</button>`}`;
  $("ir").onclick = () => novo(!temLista());
  if ($("trocar")) $("trocar").onclick = () => { if (confirm("Apagar os dados e o histórico deste celular? O que já foi enviado continua com o Dr. Luis Felipe.")) { D = { id: null, hist: [] }; salvar(); inicio(); } };
  window.scrollTo(0, 0);
}
function novo(comLista) {
  R = { inicio: Date.now(), itens: Array(10).fill(null), lista: comLista ? [] : null, alvo: "", morte: null, nota: "" };
  comLista ? telaLista() : telaItens();
}
const chaveLista = (g, i) => g + "." + i;
function telaLista() {
  const grupo = (tipo) => LISTA.map((g, gi) => g[0] !== tipo ? "" : `<p class="grupo">${esc(g[1])}</p><div class="ops lista" role="group">${g[2].map((s, i) =>
    `<button type="button" class="op" data-l="${chaveLista(gi, i)}" aria-pressed="${R.lista.includes(chaveLista(gi, i))}">${esc(s)}</button>`).join("")}</div>`).join("");
  $("tela").innerHTML = `<p class="rot">Passo 1 de 2 · Lista de sintomas</p><h1 class="tit">O que acontece com você</h1>
    <p class="sub">Toque em tudo o que acontece com você <b>atualmente</b>. Não precisa marcar o que já passou. Se nada de um grupo se aplica, siga em frente.</p>
    <div class="sec-int"><b>Obsessões</b> são pensamentos, imagens ou impulsos que invadem a mente contra a sua vontade, parecem sem sentido ou exagerados e causam aflição. Não são simples preocupações com problemas reais.</div>
    ${grupo("O")}
    <div class="sec-int" style="margin-top:22px"><b>Compulsões</b> são comportamentos ou atos mentais que você se sente levado(a) a fazer para aliviar a aflição de uma obsessão ou para que as coisas fiquem "certas".</div>
    ${grupo("C")}
    <div class="cartao"><p class="q-tit">Quais são as obsessões ou compulsões que mais atrapalham hoje?</p><p class="q-desc">Opcional. Escreva com suas palavras, até três. Ex.: "verificar o fogão várias vezes antes de sair".</p><textarea id="qalvo">${esc(R.alvo)}</textarea></div>
    <button class="btn pri larga" style="margin-top:18px" id="seguir">Continuar para as 10 perguntas</button>
    <button class="lnk" id="cancelar">Voltar sem salvar</button>`;
  $("qalvo").oninput = (e) => (R.alvo = e.target.value);
  $("seguir").onclick = telaItens; $("cancelar").onclick = inicio; window.scrollTo(0, 0);
}
function telaItens() {
  const item = (i) => `<div class="cartao" id="ci${i}"><p class="q-tit"><span class="n">${i + 1}.</span>${esc(ITENS[i].q)}</p>
    <div class="ops col" role="group">${ITENS[i].o.map((o, v) => `<button type="button" class="op" data-k="i${i}" data-v="${v}" aria-pressed="${R.itens[i] === v}"><b>${v}</b>${esc(o)}</button>`).join("")}</div><p class="q-erro">Escolha uma opção.</p></div>`;
  $("tela").innerHTML = `<p class="rot">${R.lista ? "Passo 2 de 2 · " : ""}Questionário · Y-BOCS</p><h1 class="tit">Na última semana</h1>
    <p class="sub">Pense em todas as suas obsessões e compulsões juntas e responda como foi <b>nos últimos 7 dias</b>, incluindo hoje.</p>
    ${R.lista ? "" : `<button class="lnk" id="atualizar">Meus sintomas mudaram: atualizar a lista de sintomas antes</button>`}
    <div class="sec-int"><b>Obsessões:</b> pensamentos, imagens ou impulsos que invadem a mente contra a sua vontade e causam aflição.</div>
    ${[0, 1, 2, 3, 4].map(item).join("")}
    <div class="sec-int" style="margin-top:22px"><b>Compulsões:</b> comportamentos ou atos mentais que você se sente levado(a) a fazer para aliviar a aflição (lavar, verificar, repetir, contar, ordenar, rezar ou repetir frases na mente…).</div>
    ${[5, 6, 7, 8, 9].map(item).join("")}
    <button class="btn pri larga" style="margin-top:18px" id="seguir">Continuar</button>
    <button class="lnk" id="cancelar">${R.lista ? "Voltar para a lista de sintomas" : "Voltar sem salvar"}</button>`;
  if ($("atualizar")) $("atualizar").onclick = () => { R.lista = []; telaLista(); };
  $("seguir").onclick = () => { const f = R.itens.findIndex((v) => v == null); R.itens.forEach((v, i) => $("ci" + i).classList.toggle("erro", v == null));
    if (f >= 0) return $("ci" + f).scrollIntoView({ behavior: "smooth", block: "center" }); telaFinal(); };
  $("cancelar").onclick = R.lista ? telaLista : inicio; window.scrollTo(0, 0);
}
function telaFinal() {
  $("tela").innerHTML = `<p class="rot">Para terminar</p><h1 class="tit">Mais duas perguntas</h1>
    <div class="cartao" id="cmorte"><p class="q-tit">Nos últimos dias, você teve vontade de morrer ou pensou em tirar a própria vida?</p>
      <p class="q-desc">Não conte aqui os pensamentos intrusivos de fazer mal a alguém ou a si mesmo que você não quer ter e que causam medo: esses já entraram nas perguntas anteriores. Esta pergunta é sobre <b>desejo</b> de morrer.</p>
      ${`<div class="ops" role="group">${["Não", "Sim"].map((o, i) => `<button type="button" class="op" data-k="morte" data-v="${i}" aria-pressed="${R.morte === i}">${o}</button>`).join("")}</div>`}<p class="q-erro">Responda, por favor.</p>
      <div class="alerta" id="almorte" ${R.morte === 1 ? "" : "hidden"}><b>Obrigado por contar.</b> O Dr. Luis Felipe vai ver isso com atenção. ${CVV}</div></div>
    <div class="cartao"><p class="q-tit">Quer contar algo ao Dr. Luis Felipe?</p><p class="q-desc">Opcional. O que melhorou, o que piorou, como estão os exercícios da terapia, remédios, efeitos colaterais.</p><textarea id="qnota">${esc(R.nota)}</textarea></div>
    <button class="btn pri larga" style="margin-top:18px" id="enviar">Enviar</button>
    <button class="lnk" id="cancelar">Voltar às perguntas</button>`;
  $("qnota").oninput = (e) => (R.nota = e.target.value);
  $("enviar").onclick = enviar; $("cancelar").onclick = telaItens; window.scrollTo(0, 0);
}
function relatorio(reg) {
  const id = D.id, nascBR = (id.nasc || "").split("-").reverse().join("/"), cpfF = (id.cpf || "").replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, "$1.$2.$3-$4");
  const cab = `[Y-BOCS] ${id.nome}` + (id.cpf ? ` · CPF ${id.cpf}` : "") + (nascBR ? ` · nasc. ${nascBR}` : "") + (id.tel ? ` · ${id.tel}` : "") + (id.codigo ? ` · código ${id.codigo}` : "");
  const b = [["Identificação", [`Nome completo: ${id.nome}`, cpfF && `CPF: ${cpfF}`, nascBR && `Data de nascimento: ${nascBR}`, id.tel && `Celular com DDD: ${id.tel}`, id.codigo && `Link pessoal: ${id.codigo}`, `Tempo de preenchimento: ${reg.tempo}`].filter(Boolean).join("\n")]];
  b.push(["Y-BOCS · última semana", ITENS.map((it, i) => `${i + 1}. ${it.t}: ${reg.itens[i]} (${it.o[reg.itens[i]]})`).join("\n") +
    `\nObsessões (itens 1–5): ${reg.obs}/20\nCompulsões (itens 6–10): ${reg.comp}/20\nTotal: ${reg.total}/40 · sintomas ${faixa(reg.total)}`]);
  if (reg.lista) {
    const marc = (tipo) => LISTA.map((g, gi) => g[0] !== tipo ? null : [g[1], g[2].filter((_, i) => reg.lista.includes(chaveLista(gi, i)))]).filter((x) => x && x[1].length);
    const txt = (tipo) => marc(tipo).map(([g, xs]) => `${g}: ${xs.join("; ")}`).join("\n") || "nenhuma marcada";
    b.push(["Lista de sintomas (atuais)", `OBSESSÕES\n${txt("O")}\nCOMPULSÕES\n${txt("C")}`]);
    b.push(["Sintomas que mais atrapalham", reg.alvo.trim()]);
  }
  b.push(["Pensamentos de morte", `Vontade de morrer ou de tirar a própria vida: ${reg.morte === 1 ? "SIM" : "Não"}`]);
  b.push(["Observações do paciente", reg.nota.trim()]);
  const corpo = (reg.morte === 1 ? "⚠ ATENÇÃO: sinal de risco (vontade de morrer ou de tirar a própria vida) nas respostas.\n\n" : "") +
    `ACOMPANHAMENTO DO TOC · Y-BOCS (respondido pelo paciente)\n${new Date(reg.d).toLocaleString("pt-BR")}\n\n` + b.map(([t, x]) => `## ${t}\n${x || "—"}`).join("\n\n");
  return { cab, corpo };
}
async function enviar() {
  if (R.morte == null) { $("cmorte").classList.add("erro"); return $("cmorte").scrollIntoView({ behavior: "smooth", block: "center" }); }
  const min = Math.max(1, Math.round((Date.now() - R.inicio) / 60000));
  const reg = { d: new Date().toISOString(), itens: R.itens.slice(), obs: soma(R.itens, 0, 5), comp: soma(R.itens, 5, 10), total: soma(R.itens, 0, 10),
    lista: R.lista ? R.lista.slice() : null, alvo: R.alvo || "", morte: R.morte, nota: R.nota, tempo: `${min} minuto${min > 1 ? "s" : ""}` };
  const b = $("enviar"); b.disabled = true; b.textContent = "Enviando…";
  const { cab, corpo } = relatorio(reg), fd = new URLSearchParams();
  fd.append(CAMPO_PACIENTE, cab); fd.append(CAMPO_RESPOSTAS, corpo);
  try {
    await fetch(FORM_EXTRA, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: fd.toString() });
  } catch (err) {
    b.disabled = false; b.textContent = "Tentar enviar de novo";
    return alert("Não foi possível enviar. Confira a internet e tente de novo.");
  }
  D.hist.push({ d: reg.d, total: reg.total, obs: reg.obs, comp: reg.comp, lista: !!reg.lista }); salvar();
  concluido(reg);
}
function concluido(reg) {
  const ps = D.hist, base = ps[0];
  let msg = "";
  if (MOSTRAR_PONTUACAO) {
    msg = `<div class="cartao"><p class="q-tit">Resultado de hoje</p><div class="res"><b>${reg.total}</b><span class="sub">de 40 · sintomas ${faixa(reg.total)}</span></div>
      <p class="q-desc">Obsessões: ${reg.obs} de 20 · Compulsões: ${reg.comp} de 20</p>`;
    if (ps.length > 1) {
      const dif = reg.total - ps[ps.length - 2].total, pct = base.total ? Math.round((base.total - reg.total) / base.total * 100) : 0;
      msg += `<p class="q-desc" style="margin-top:8px">${dif < 0 ? `${-dif} ponto${dif < -1 ? "s" : ""} a menos que na última avaliação.` : dif > 0 ? `${dif} ponto${dif > 1 ? "s" : ""} a mais que na última avaliação. Vale conversar sobre isso na próxima consulta.` : "Igual à última avaliação."}${pct > 0 ? ` Desde a primeira, os sintomas caíram ${pct}%.` : ""}</p>`;
    }
    msg += `<p class="nota" style="margin-top:8px">Este número ajuda a acompanhar a evolução; quem interpreta é o Dr. Luis Felipe, junto com tudo o que você conta.</p></div>`;
  }
  $("tela").innerHTML = `<section class="fim"><h1>Recebido, obrigado!</h1><p class="sub" style="max-width:40ch">Suas respostas chegaram ao Dr. Luis Felipe. A próxima avaliação é daqui a ${DIAS_AVAL} dias.</p></section>${msg}
    ${reg.morte === 1 ? `<div class="alerta">${CVV}</div>` : ""}
    <button class="btn sec larga" style="margin-top:18px" id="voltar">Voltar ao início</button>`;
  $("voltar").onclick = inicio; window.scrollTo(0, 0);
}

// ====== EVENTOS ======
document.addEventListener("input", (ev) => { if (ev.target.dataset.cpf) ev.target.value = mascaraCpf(ev.target.value); });
document.addEventListener("click", (ev) => {
  const l = ev.target.closest("[data-l]");
  if (l && R && R.lista) { const k = l.dataset.l; R.lista = R.lista.includes(k) ? R.lista.filter((x) => x !== k) : [...R.lista, k]; l.setAttribute("aria-pressed", R.lista.includes(k)); return; }
  const b = ev.target.closest("[data-k]"); if (!b || !R) return;
  const k = b.dataset.k, v = +b.dataset.v;
  if (k[0] === "i") R.itens[+k.slice(1)] = v; else R[k] = v;
  b.parentElement.querySelectorAll(".op").forEach((x) => x.setAttribute("aria-pressed", x === b));
  b.closest(".cartao")?.classList.remove("erro");
  if (k === "morte") $("almorte").hidden = v !== 1;
});
inicio();
</script>
